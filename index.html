<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>아침 별 모으기</title>
<!-- 홈 화면에 추가하면 주소창 없이 앱처럼 -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="별 모으기">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --green:#58c322;--green-d:#46a016;--green-l:#eaf8df;
  --blue:#1fa8f0;--blue-d:#1489c8;--blue-l:#ddf2fe;
  --gold:#ffc61a;--gold-d:#e0a500;
  --red:#ff6b6b;--red-d:#e04848;--red-l:#ffe8e8;
  --ink:#3c3c3c;--sub:#8b8b8b;--line:#e5e5e5;--line-d:#cfcfcf;--bg:#fff;
  --star-l:#fff4c7;--star-l-d:#f0d47a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Jua',system-ui,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;height:100dvh;-webkit-tap-highlight-color:transparent;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
/* 3D 그림은 글자 크기(em)를 따라 커짐 */
img.e{width:1.15em;height:1.15em;vertical-align:-.2em;object-fit:contain;pointer-events:none;-webkit-user-drag:none}
/* 동그라미·버튼 안 그림은 글자 줄 위치가 아니라 칸의 정가운데에 (사파리는 버튼 안 정렬이 크롬과 달라서 직접 지정) */
.node,.stone,.spk,.spk2,.icon,.tip>span{display:grid;place-items:center;padding:0}
.node img.e,.stone img.e,.spk img.e,.spk2 img.e,.icon img.e,.tip img.e,.ti img.e,.big img.e,.mascot img.e{display:block;margin:0 auto}
.node img.e{width:1.35em;height:1.35em}
.choice span.multi{font-size:40px}
.choice span{display:flex;justify-content:center;gap:2px}

/* 위: 날짜·시계·별 */
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:2px solid var(--line)}
.when{flex:1;line-height:1.1}
#date{color:var(--sub);font-size:16px}
#clock{font-size:30px}
.chip{display:flex;align-items:center;gap:6px;font-size:22px;padding:6px 12px;border-radius:14px;border:2px solid var(--line)}
.icon{border:0;background:none;font-size:26px;padding:6px}

.bar{height:18px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:0;background:var(--green);border-radius:99px;transition:width .4s;box-shadow:inset 0 -5px 0 rgba(0,0,0,.08),inset 0 4px 0 rgba(255,255,255,.35)}

/* 오늘 카드: 출발까지 · 날씨 */
.cards{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:18px}
.tcard{display:flex;align-items:center;gap:12px;text-align:left;background:#fff;border:2px solid var(--line);border-bottom-width:5px;border-radius:20px;padding:12px 14px;min-width:0}
button.tcard:active{transform:translateY(3px);border-bottom-width:2px;margin-top:3px}
.ti{flex:none;width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:34px;background:var(--green-l)}
.wx .ti{background:var(--blue-l)}
.tt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.tt small{color:var(--sub);font-size:15px}
.tt b{font-weight:400;font-size:26px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leave .tt b{color:var(--green-d)}
.wx .tt b{color:var(--blue-d)}
.tt span{font-size:15px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcard .bar{height:14px;margin:4px 0 2px}
/* 출발 알림: soon(15분 전부터) 노란 막대 + 시계 흔들기, now(5분 전부터) 빨간 막대 깜빡 + 카드 번쩍 + 시계 세게 흔들기 */
.leave[data-rush=soon]{border-color:var(--gold)}
.leave[data-rush=soon] .tt b{color:var(--gold-d)}
.leave[data-rush=soon] .bar i{background:var(--gold)}
.leave[data-rush=soon] .ti{background:var(--star-l)}
.leave[data-rush=soon] .ti img{animation:ring 1.6s ease-in-out infinite}
.leave[data-rush=now]{border-color:var(--red);animation:flash 1s ease-in-out infinite}
.leave[data-rush=now] .tt b{color:var(--red-d)}
.leave[data-rush=now] .bar i{background:var(--red);animation:blink .5s steps(1) infinite}
.leave[data-rush=now] .ti{background:var(--red-l)}
.leave[data-rush=now] .ti img{animation:ring .7s ease-in-out infinite}
@keyframes ring{0%,45%,100%{transform:rotate(0)}5%,15%,25%,35%{transform:rotate(-16deg)}10%,20%,30%,40%{transform:rotate(16deg)}}
@keyframes flash{50%{background:var(--red-l)}}
@keyframes blink{50%{opacity:.3}}

/* 안내 카드(날씨·옷 입기 도움말) */
.tips{display:flex;flex-direction:column;gap:10px;margin:0 0 22px}
.tip{display:flex;align-items:center;gap:12px;background:var(--blue-l);border-radius:16px;padding:12px 16px;font-size:22px;text-align:left}
.tip span{font-size:36px;line-height:1}
.facts{font-size:20px;color:var(--sub);margin:-10px 0 18px;line-height:1.5}
.src{color:var(--sub);font-size:14px}

main{flex:1;overflow:auto}
.view{max-width:980px;margin:0 auto;padding:16px}

/* 이번 주 배너 (듀오링고 유닛 배너 느낌) */
.unit{background:var(--green);color:#fff;border-radius:18px;padding:14px 18px;box-shadow:0 5px 0 var(--green-d);display:flex;flex-direction:column;gap:4px}
.unit small{opacity:.9;font-size:15px}
.unit b{font-size:24px;font-weight:400}
.unit span{font-size:16px;opacity:.95}
.unit.blue{background:var(--blue);box-shadow:0 5px 0 var(--blue-d)}
.unit .btn{align-self:flex-start;margin-top:6px}

/* 길 */
/* 할 일 카드: 아이 얼굴이 그 일을 하는 큰 그림. 폰 2줄, 세로 태블릿 3줄, 가로 태블릿 한 줄 5개 */
.path{display:grid;grid-template-columns:repeat(2,1fr);gap:22px 14px;padding:26px 0 24px}
.task{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;padding:10px 8px 12px;border:3px solid var(--line);border-bottom-width:8px;border-radius:26px;background:#fff;font:inherit;color:inherit;transition:transform .1s}
.task .art{width:100%;aspect-ratio:200/230;display:grid;place-items:center;font-size:90px}
.task .art svg{width:100%;height:100%;display:block}
.task .art img.e{display:block;margin:0 auto}
.task .label{font-size:24px;text-align:center;word-break:keep-all}
.task:active{transform:translateY(5px);border-bottom-width:3px}
.task.cur{border-color:var(--green);background:var(--green-l);animation:pulse2 1.6s ease-in-out infinite}
.task.done{border-color:var(--gold-d);background:#fff7d6}
.task.done .art{opacity:.55}
.task.done::after{content:'✓';position:absolute;right:8px;top:8px;width:40px;height:40px;border-radius:50%;background:var(--gold);color:#fff;font-size:26px;line-height:40px;text-align:center;box-shadow:0 3px 0 var(--gold-d)}
.task.goal{cursor:default;border-style:dashed;background:var(--star-l)}
.task.goal:active{transform:none;border-bottom-width:8px}
.task.goal.done .art{opacity:1}
.task.goal.done::after{display:none}
.gotag{position:absolute;top:-16px;left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--green);color:#fff;border-radius:14px;padding:4px 12px;font-size:17px;box-shadow:0 3px 0 var(--green-d);z-index:1}
@keyframes pulse2{50%{transform:scale(1.03)}}
@keyframes pulse{50%{transform:scale(1.06)}}
@keyframes bob{50%{transform:translateY(-4px)}}

/* 별 모으기: 밤하늘에 별을 하나씩 채움. 아직 못 받은 별은 흐리게 + 숫자 */
.river{border-radius:24px;margin-top:16px;padding:24px 0;display:flex;flex-direction:column;align-items:center;gap:14px;
  background:radial-gradient(#fff6 1.5px,transparent 2px) 0 0/52px 52px,radial-gradient(#fff3 1px,transparent 1.5px) 26px 26px/52px 52px,linear-gradient(#2b3180,#4d58b8)}
.stone-row{display:flex;align-items:center;gap:10px;transform:translateX(var(--x))}
.stone{width:72px;height:72px;border:0;border-radius:50%;background:none;font-size:62px;position:relative}
.stone>*{grid-area:1/1}
.stone>img.e{width:1em;height:1em}
.stone:not(.done):not(.gift)>img.e{filter:grayscale(1) brightness(1.8);opacity:.3}
.stone>b{font-weight:400;font-size:22px;color:#fff;text-shadow:0 1px 3px #0008}
.stone.gift{font-size:46px;background:#ffffff22;outline:4px solid var(--gold);outline-offset:3px}
.flag{background:#fff;border:2px solid var(--gold);border-radius:12px;padding:4px 10px;font-size:16px;max-width:180px}
.me{position:absolute;left:50%;bottom:60%;transform:translateX(-50%);font-size:40px;animation:bob 1.4s ease-in-out infinite;pointer-events:none}
.bank{position:relative;margin-top:6px;padding:10px 24px;border-radius:16px;background:var(--green-l);font-size:20px}
.bank .me{bottom:80%}

/* 아침 음악: 아래 탭 바로 위 오른쪽에 작은 화면 + 켜기/끄기 */
.music{position:fixed;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--line);border-radius:18px;padding:6px;box-shadow:0 4px 0 var(--line);z-index:5}
.music iframe{width:160px;height:90px;border-radius:12px;display:block;border:0}
#musicBtn{border:0;width:64px;height:64px;border-radius:50%;font-size:34px;display:grid;place-items:center;padding:0;background:var(--line);box-shadow:0 4px 0 var(--line-d);filter:grayscale(1)}
#musicBtn.on{background:var(--green-l);box-shadow:0 4px 0 var(--green);filter:none;animation:pulse 1.6s ease-in-out infinite}
#musicBtn img.e{display:block;margin:0 auto}
body.has-music .view{padding-bottom:130px}

/* 아래 탭 */
.tabs{display:flex;border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;border:0;background:none;padding:8px 0 10px;font-size:26px;display:flex;flex-direction:column;align-items:center;border-top:3px solid transparent;color:var(--sub)}
.tabs button span{font-size:15px}
.tabs button.on{color:var(--blue);border-top-color:var(--blue);background:var(--blue-l)}

/* 버튼 */
.btn{border:0;border-radius:16px;padding:14px 24px;font-size:21px;color:#fff;background:var(--green);box-shadow:0 5px 0 var(--green-d);transition:transform .08s}
.btn:active{transform:translateY(5px);box-shadow:none}
.btn.white{background:#fff;color:var(--blue);border:2px solid var(--line);box-shadow:0 5px 0 var(--line)}
.btn.sm{font-size:17px;padding:8px 14px}
.btn:disabled{background:var(--line);color:#aaa;box-shadow:0 5px 0 var(--line-d);transform:none}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.row .btn{flex:1}

/* 겹쳐 뜨는 화면 */
.full{position:fixed;inset:0;background:#fff;z-index:10;overflow:auto}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.panel{background:#fff;width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom));text-align:center;animation:up .2s ease-out}
.panel h2{font-weight:400;font-size:28px;margin:6px 0 20px}
.panel h2 span{display:block;font-size:.85em;color:var(--sub);margin-top:2px}
/* 다 했어요? — 그림 버튼 두 개. 초록(했어요)이 더 크고 오른쪽 */
.asktop{position:relative;display:inline-block;animation:popin .45s cubic-bezier(.3,1.6,.6,1)}
.spk2{position:absolute;left:100%;top:50%;transform:translateY(-50%);margin-left:12px;border:0;background:var(--blue-l);border-radius:16px;font-size:28px;padding:8px 10px;box-shadow:0 4px 0 #b9e3fb}
.picks{display:flex;gap:14px;align-items:stretch}
.pick{flex:1;border:0;border-radius:24px;padding:14px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:22px;transition:transform .08s}
.pick img.e{font-size:60px}
.pick.no{background:#fff;color:var(--sub);border:3px solid var(--line);box-shadow:0 6px 0 var(--line)}
.pick.yes{flex:1.6;background:var(--green);color:#fff;box-shadow:0 6px 0 var(--green-d)}
.pick:active{transform:translateY(6px);box-shadow:none}
.task.pop{animation:popin .5s cubic-bezier(.3,1.6,.6,1)}
@keyframes popin{0%{transform:scale(.5)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.big{font-size:84px;line-height:1}
.big svg{width:3em;height:3.45em;display:block;margin:0 auto}
@keyframes up{from{transform:translateY(40px);opacity:0}}

/* 배움 */
.lesson{max-width:720px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:16px}
.ltop{display:flex;align-items:center;gap:14px}
.ltop .bar{flex:1;margin:0}
.x{border:0;background:none;font-size:28px;color:var(--sub);padding:4px 8px}
.tag{color:var(--sub);font-size:16px;margin:16px 0 4px}
.talk{display:flex;align-items:flex-end;gap:12px;margin:8px 0 6px}
.mascot{font-size:72px;line-height:1}
.say{position:relative;flex:1;border:2px solid var(--line);border-radius:18px;padding:14px 50px 14px 16px;font-size:21px;line-height:1.4}
.spk{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:var(--blue-l);border-radius:12px;font-size:22px;padding:6px 8px}
.lesson h2{font-weight:400;font-size:28px;margin:18px 0 14px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.choice{border:2px solid var(--line);border-radius:18px;background:#fff;box-shadow:0 5px 0 var(--line);padding:16px 8px;font-size:21px;display:flex;flex-direction:column;align-items:center;gap:6px}
.choice span{font-size:56px;line-height:1.1}
.choice.sel{border-color:var(--blue);background:var(--blue-l);box-shadow:0 5px 0 var(--blue);color:var(--blue-d)}
.choice.wrong{opacity:.4;animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.lfoot{margin:auto -16px -16px;padding:18px 16px calc(18px + env(safe-area-inset-bottom));border-top:2px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.lfoot .msg{flex:1;font-size:22px;min-width:200px}
.lfoot .btn{min-width:160px}
.lfoot.good{background:var(--green-l);color:var(--green-d);border-color:transparent}
.lfoot.bad{background:var(--red-l);color:var(--red-d);border-color:transparent}
.lfoot.bad .btn{visibility:hidden}

/* 보상·축하 카드 */
.show{display:flex;align-items:center;justify-content:center;min-height:100%;padding:24px}
.card{text-align:center;max-width:720px}
.card .big{font-size:120px;animation:pop .5s cubic-bezier(.3,1.6,.6,1)}
.card h2{font-weight:400;font-size:30px;color:var(--sub);margin:12px 0}
.card p{font-size:28px;margin:0 0 28px;line-height:1.4}
.card p.huge{font-size:clamp(40px,8vw,84px);color:var(--ink);word-break:keep-all}
.card .btn{min-width:220px}
@keyframes pop{from{transform:scale(.3)}}
.conf{position:fixed;top:-20px;width:12px;height:16px;border-radius:3px;z-index:20;animation:fall 2.2s ease-in forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}

/* 설정 */
.set{max-width:640px;margin:0 auto;padding:20px 16px 40px;font-size:18px}
.set h2{font-weight:400;font-size:28px}
.set h3{font-weight:400;font-size:21px;margin:26px 0 8px}
.set h3 small{display:block;color:var(--sub);font-size:15px;margin-top:2px}
.set label{display:flex;align-items:center;gap:12px;margin:10px 0}
.set input,.set select{font:inherit;font-size:18px;padding:8px 10px;border:2px solid var(--line);border-radius:12px;min-width:0;background:#fff}
.set label input,.set label select{flex:1}
.item{margin:8px 0;flex-wrap:nowrap}
.item .emo{width:64px;text-align:center}
.item .at{width:76px}
.item .nm,.item .tx{flex:1}
.set .row>b{font-size:28px;min-width:60px;text-align:center}
.set .row .btn.sm{flex:0}
.week{padding-left:20px;line-height:1.5}
.week li{margin:6px 0}
.week li.today{color:var(--green-d)}
.week small,.src{color:var(--sub);font-size:14px}
.end{margin-top:28px}

/* 태블릿(아이패드 프로 10.5 = 세로 834 / 가로 1112 기준): 5살이 한눈에 알아보게 전부 크게 */
@media (min-width:768px) and (min-height:700px){
  .top{padding:14px 28px}
  #date{font-size:22px} #clock{font-size:44px}
  .chip{font-size:32px;padding:8px 18px;border-radius:18px}
  .icon{font-size:40px}
  .bar{height:26px}
  .view{padding:24px 28px}
  .cards{grid-template-columns:1fr 1fr;gap:18px;margin-bottom:24px}
  .tcard{padding:16px 18px;border-radius:26px;gap:16px}
  .ti{width:74px;height:74px;font-size:48px;border-radius:20px}
  .tt small{font-size:20px} .tt b{font-size:34px} .tt span{font-size:19px}
  .tcard .bar{height:18px}
  .tip{font-size:30px;padding:16px 22px;border-radius:20px}
  .tip span{font-size:54px}
  .facts{font-size:26px}
  .src{font-size:18px}
  .set select{font-size:22px}
  .unit{padding:18px 26px;border-radius:24px}
  .unit small{font-size:20px} .unit b{font-size:36px} .unit span{font-size:22px}
  .path{grid-template-columns:repeat(3,1fr);gap:34px 20px;padding-top:34px}
  .task{border-radius:32px;padding:14px 10px 16px}
  .task .art{font-size:150px}
  .task .label{font-size:32px}
  .task.done::after{width:56px;height:56px;font-size:36px;line-height:56px}
  .gotag{font-size:24px;padding:6px 16px;top:-22px}
  .river{gap:22px;padding:36px 0}
  .stone-row{transform:translateX(calc(var(--x) * 1.8))}
  .stone{width:112px;height:112px;font-size:96px}
  .stone>b{font-size:34px}
  .stone.gift{font-size:72px;outline-width:6px}
  .flag{font-size:24px;max-width:300px;padding:6px 14px}
  .me{font-size:64px}
  .bank{font-size:28px;padding:14px 32px}
  .tabs button{font-size:44px;padding:10px 0 14px}
  .tabs button span{font-size:22px}
  .music{bottom:calc(110px + env(safe-area-inset-bottom));right:20px}
  .music iframe{width:240px;height:135px}
  #musicBtn{width:96px;height:96px;font-size:52px}
  body.has-music .view{padding-bottom:180px}
  .btn{font-size:28px;padding:18px 30px;border-radius:20px}
  .btn.sm{font-size:22px;padding:10px 18px}
  .panel{max-width:760px;padding:36px 32px}
  .panel .big{font-size:140px}
  .panel h2{font-size:42px;margin:12px 0 30px}
  .spk2{font-size:40px;padding:10px 14px;border-radius:20px}
  .picks{gap:22px}
  .pick{font-size:32px;padding:22px 10px 18px;border-radius:30px}
  .pick img.e{font-size:100px}
  .lesson{max-width:900px;padding:24px 28px}
  .ltop .bar{height:26px}
  .x{font-size:40px}
  .tag{font-size:22px}
  .mascot{font-size:120px}
  .say{font-size:32px;padding:20px 72px 20px 24px;border-radius:24px}
  .spk{font-size:34px;padding:8px 12px}
  .lesson h2{font-size:42px;margin:28px 0 22px}
  .choices{grid-template-columns:repeat(3,1fr);gap:22px}
  .choice{font-size:30px;padding:24px 10px;border-radius:24px;box-shadow:0 7px 0 var(--line)}
  .choice.sel{box-shadow:0 7px 0 var(--blue)}
  .choice span{font-size:110px}
  .choice span.multi{font-size:64px}
  .lfoot{margin:auto -28px -24px;padding:24px 28px}
  .lfoot .msg{font-size:32px}
  .lfoot .btn{min-width:240px}
  .card .big{font-size:200px}
  .card h2{font-size:40px}
  .card p{font-size:38px}
  .card p.huge{font-size:clamp(60px,9vw,110px)}
  .set{font-size:22px;max-width:760px}
  .set input{font-size:22px}
}
/* 가로 태블릿: 화면이 낮으니 길을 옆으로 눕혀서 스크롤 없이 한 화면에 */
@media (min-width:1000px) and (orientation:landscape){
  .path{grid-template-columns:repeat(5,1fr);gap:16px;padding-top:30px}
  .unit{padding:12px 22px;flex-direction:row;align-items:baseline;flex-wrap:wrap;column-gap:14px}
  .unit b{font-size:30px}
  .task .art{aspect-ratio:auto;height:min(28vh,230px)}
  .task .label{font-size:28px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
